services:
  vmtech:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      VMTECH_RUNTIME_CONTEXT: "This is a self-hosted VMTech instance. Ollama runs privately in a container on the same machine as the app."
      VMTECH_PUBLIC_HTTPS: ${VMTECH_PUBLIC_HTTPS:-false}
      VMTECH_ACCESS_PASSWORD: ${VMTECH_ACCESS_PASSWORD:-}
      VMTECH_SESSION_SECRET: ${VMTECH_SESSION_SECRET:-}
      VMTECH_AI_PROVIDER: ${VMTECH_AI_PROVIDER:-ollama}
      VMTECH_OPENAI_BASE_URL: ${VMTECH_OPENAI_BASE_URL:-}
      VMTECH_OPENAI_MODEL: ${VMTECH_OPENAI_MODEL:-}
      VMTECH_OPENAI_API_KEY: ${VMTECH_OPENAI_API_KEY:-}
      VMTECH_ALLOW_PROVIDER_SETTINGS: ${VMTECH_ALLOW_PROVIDER_SETTINGS:-true}
      OLLAMA_BASE_URL: http://ollama:11434
      VMTECH_LEE_1_MODEL: ${VMTECH_LEE_1_MODEL:-}
      VMTECH_LEE_2_LITE_MODEL: ${VMTECH_LEE_2_LITE_MODEL:-qwen3.5:9b}
      VMTECH_LEE_2_PRO_MODEL: ${VMTECH_LEE_2_PRO_MODEL:-qwen3.5:27b}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-300000}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-6144}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1024}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    ports:
      - "127.0.0.1:${VMTECH_PORT:-3000}:3000"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_NUM_CTX:-6144}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "8"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  ollama-models:
